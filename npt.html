<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春华使用南普陀名单转换工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 800px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 6px; }
  .subtitle {
    font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.6;
  }
  .subtitle .badge {
    background: #fff3cd; color: #856404; padding: 1px 6px; border-radius: 3px; font-weight: 600; font-size: 12px;
  }
  .subtitle .comma {
    background: #fce4ec; color: #c62828; padding: 1px 6px; border-radius: 3px; font-weight: 600; font-size: 12px;
  }
  textarea {
    width: 100%; height: 200px;
    border: 2px solid #e0e0e0; border-radius: 10px; padding: 14px;
    font-size: 14px; font-family: Consolas, "Microsoft YaHei", monospace;
    resize: vertical; transition: border-color 0.2s; line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: #4a6cf7; }
  .btn-row { display: flex; gap: 12px; margin: 16px 0; }
  button {
    padding: 12px 20px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
  }
  .btn-main {
    flex: 2; background: #4a6cf7; color: #fff;
  }
  .btn-main:hover { background: #3b5de7; }
  .btn-main:active { transform: scale(0.97); }
  .btn-copy { flex: 1; background: #e8f0fe; color: #4a6cf7; }
  .btn-copy:hover { background: #d0e2fd; }
  .btn-reset { flex: 1; background: #f5f5f5; color: #666; }
  .btn-reset:hover { background: #ebebeb; }
  .result-box {
    background: #f8fafc; border: 2px solid #e0e0e0; border-radius: 10px;
    padding: 14px; min-height: 60px; font-size: 14px;
    word-break: break-all; line-height: 1.6;
    font-family: Consolas, "Microsoft YaHei", monospace; color: #333;
  }
  .result-box.empty { color: #ccc; font-style: italic; }
  .stats {
    display: flex; gap: 20px; margin-top: 12px; font-size: 13px; color: #888;
  }
  .stats strong { color: #4a6cf7; }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 24px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; }
  .preview-row {
    margin-top: 8px; padding: 8px 12px; background: #f0f4ff; border-radius: 6px;
    font-size: 12px; color: #4a6cf7; max-height: 80px; overflow-y: auto;
    line-height: 1.5; word-break: break-all;
  }
</style>
</head>
<body>

<div class="container">
  <h1>📋 格式加工工具</h1>
  <p class="subtitle">
    点击蓝色按键可以得到所要的结果
  </p>

  <textarea id="input" placeholder="将 Excel 中复制的内容粘贴到这里...（两列数据）"></textarea>

  <div class="btn-row">
    <button class="btn-main" onclick="doProcess()">🔀 工作</button>
    <button class="btn-copy" onclick="doCopy()">📋 复制结果</button>
    <button class="btn-reset" onclick="doReset()">↺ 重置</button>
  </div>

  <div class="result-box empty" id="output">加工后的结果将显示在这里</div>

  <div class="preview-row" id="preview"></div>

  <div class="stats">
    <span>原字符数：<strong id="statBefore">0</strong></span>
    <span>清理后：<strong id="statAfter">0</strong></span>
    <span>清除空白：<strong id="statRemoved">0</strong></span>
    <span>解析行数：<strong id="statRows">0</strong></span>
	<span>作者:春华</span>
  </div>
  
</div>

<div class="toast" id="toast"></div>

<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const toast = document.getElementById('toast');
  const preview = document.getElementById('preview');

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function doProcess() {
    const raw = input.value;
    if (!raw.trim()) { showToast('请先粘贴内容'); return; }

    let rowCount = 0;
    const lines = raw.split(/\r?\n/);
    const parts = [];

    for (let line of lines) {
      const trimmed = line.trim();
      if (!trimmed) continue;
      const cols = trimmed.split(/\t/);
      if (cols.length >= 2) {
        parts.push(cols[0] + ',' + cols[1] + ',');
        rowCount++;
      } else if (cols.length === 1 && cols[0]) {
        parts.push(cols[0] + ',');
        rowCount++;
      }
    }

    const combined = parts.join('');
    const cleaned = combined.replace(/[\s\u00A0\u3000\u2000-\u200F\u2028\u2029\u202F\u205F\uFEFF]+/g, '');

    // 预览
    if (parts.length > 0) {
      const show = parts.slice(0, 8);
      preview.innerHTML = '<strong>预览（前' + Math.min(8, parts.length) + '行，清空前）：</strong><br>' +
        show.map(p => '<code>' + escapeHTML(p) + '</code>').join('<br>');
      if (parts.length > 8) preview.innerHTML += '<br>... 共 ' + parts.length + ' 行';
    }

    document.getElementById('statBefore').textContent = raw.length;
    document.getElementById('statAfter').textContent = cleaned.length;
    document.getElementById('statRemoved').textContent = raw.length - cleaned.length;
    document.getElementById('statRows').textContent = rowCount;

    if (cleaned) {
      output.textContent = cleaned;
      output.classList.remove('empty');
    } else {
      output.textContent = '(清理后无内容)';
      output.classList.add('empty');
    }
  }

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function doCopy() {
    const text = output.textContent;
    if (!text || output.classList.contains('empty')) { showToast('没有可复制的内容'); return; }
    navigator.clipboard.writeText(text).then(() => {
      showToast('✅ 已复制到剪贴板');
    }).catch(() => {
      const range = document.createRange();
      range.selectNodeContents(output);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      showToast('请按 Ctrl+C 复制（已自动选中）');
    });
  }

  function doReset() {
    input.value = '';
    output.textContent = '加逗号并清理后的结果将显示在这里';
    output.classList.add('empty');
    preview.innerHTML = '';
    document.getElementById('statBefore').textContent = '0';
    document.getElementById('statAfter').textContent = '0';
    document.getElementById('statRemoved').textContent = '0';
    document.getElementById('statRows').textContent = '0';
  }
</script>

</body>
</html>
